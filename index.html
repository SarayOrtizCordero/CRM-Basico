<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Melray Básico · Demo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <script>
    // Aplica el tema guardado antes de pintar, para evitar un parpadeo del
    // tema equivocado al cargar la página. Por defecto siempre es claro.
    (function () {
      try {
        var stored = localStorage.getItem("crmbasico-theme");
        document.documentElement.setAttribute("data-theme", stored === "dark" ? "dark" : "light");
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div class="topbar-brand">
        <span class="brand-mark">
          <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
            <defs>
              <linearGradient id="fueguitoGradBasico" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="#fb7b15"/>
                <stop offset="1" stop-color="#df3314"/>
              </linearGradient>
            </defs>
            <path fill="url(#fueguitoGradBasico)" d="M15 2.3C18.3 6.3 22.2 10.8 22.8 16.2C23.7 11.7 22.2 8.3 20.7 6.3C23.7 8.7 25.8 13.2 25.5 18.3C25.5 25.2 20.9 30.3 15 30.3C9.2 30.3 4.5 25.2 4.5 18.3C4.5 13.8 6.9 10.2 10.2 7.5C9 10.2 9.3 13.2 11.1 15C10.5 10.8 12.3 6.3 15 2.3Z"/>
          </svg>
        </span>
        <div>
          <h1>Melray Básico</h1>
          <p class="subtitle-tag">Menos WhatsApp. Menos tareas manuales. Más pacientes.</p>
        </div>
      </div>
      <div class="topbar-actions">
        <button class="theme-toggle" id="themeToggle" title="Cambiar tema" aria-label="Cambiar tema">
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><line x1="12" y1="2" x2="12" y2="4"></line><line x1="12" y1="20" x2="12" y2="22"></line><line x1="4.93" y1="4.93" x2="6.34" y2="6.34"></line><line x1="17.66" y1="17.66" x2="19.07" y2="19.07"></line><line x1="2" y1="12" x2="4" y2="12"></line><line x1="20" y1="12" x2="22" y2="12"></line><line x1="4.93" y1="19.07" x2="6.34" y2="17.66"></line><line x1="17.66" y1="6.34" x2="19.07" y2="4.93"></line></svg>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="dashboard">
    <section class="panel">
      <p class="section-label">Resumen</p>
      <div class="stats-grid" id="stats-grid"></div>
    </section>

    <section class="panel">
      <div class="toolbar">
        <div class="toolbar-filters">
          <div class="search-input-wrap">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
            <input type="text" id="search-input" placeholder="Buscar por nombre o servicio...">
          </div>
          <select id="filter-status">
            <option value="">Todos los estados</option>
            <option value="nuevo">Nuevo contacto</option>
            <option value="recibida">Consulta recibida</option>
            <option value="contactado">Contactado</option>
            <option value="interesado">Interesado</option>
            <option value="turno">Turno reservado</option>
            <option value="atendido">Atendido</option>
            <option value="seguimiento">Seguimiento</option>
          </select>
        </div>
        <div class="view-toggle">
          <button type="button" data-view="kanban" class="active">Pipeline</button>
          <button type="button" data-view="tabla">Tabla</button>
        </div>
        <div class="toolbar-actions">
          <button id="open-add-contact" class="btn-primary btn-icon-text">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Nuevo paciente
          </button>
        </div>
      </div>
    </section>

    <section class="panel">
      <div class="kanban-board" id="kanban-board"></div>
      <div class="contacts-table-wrap hidden" id="table-wrap">
        <table class="contacts-table">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Servicio</th>
              <th>Origen</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Estado</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="contacts-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <!-- Modal: Añadir/editar contacto -->
  <div id="contact-modal" class="modal hidden">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="contact-modal-title">Nuevo paciente</h2>
        <button type="button" class="modal-close" data-close-modal aria-label="Cerrar">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><line x1="6" y1="6" x2="18" y2="18"/><line x1="6" y1="18" x2="18" y2="6"/></svg>
        </button>
      </div>
      <form id="contact-form">
        <label for="contact-name">Nombre</label>
        <input type="text" id="contact-name" required placeholder="Ej: Marta Gil">

        <div class="field-row">
          <div>
            <label for="contact-service">Servicio de interés</label>
            <input type="text" id="contact-service" placeholder="Ej: Limpieza dental">
          </div>
          <div>
            <label for="contact-source">Origen</label>
            <select id="contact-source">
              <option value="whatsapp">WhatsApp</option>
              <option value="instagram">Instagram</option>
              <option value="web">Web</option>
              <option value="telefono">Teléfono</option>
              <option value="formulario">Formulario</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div>
            <label for="contact-email">Email</label>
            <input type="email" id="contact-email" placeholder="ejemplo@email.com">
          </div>
          <div>
            <label for="contact-phone">Teléfono</label>
            <input type="tel" id="contact-phone" placeholder="+34 600 000 000">
          </div>
        </div>

        <label for="contact-status">Estado</label>
        <select id="contact-status">
          <option value="nuevo">Nuevo contacto</option>
          <option value="recibida">Consulta recibida</option>
          <option value="contactado">Contactado</option>
          <option value="interesado">Interesado</option>
          <option value="turno">Turno reservado</option>
          <option value="atendido">Atendido</option>
          <option value="seguimiento">Seguimiento</option>
        </select>

        <label for="contact-notes">Notas</label>
        <textarea id="contact-notes" rows="3" placeholder="Notas sobre el paciente..."></textarea>

        <div class="modal-buttons">
          <button type="button" class="btn-secondary" data-close-modal>Cancelar</button>
          <button type="submit" class="btn-primary">Guardar paciente</button>
        </div>
      </form>
    </div>
  </div>

  <div id="toast-container" class="toast-container" role="status" aria-live="polite"></div>

  <script src="js/store.js"></script>
  <script src="js/app.js"></script>
  <script src="js/theme.js"></script>
</body>
</html>
